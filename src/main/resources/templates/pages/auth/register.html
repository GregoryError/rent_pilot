<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — OptiRent</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f6f5f2">
    <th:block th:replace="~{fragments/site :: icons}"></th:block>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <script th:src="@{/js/theme.js}"></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-root);
            padding: 1rem;
        }
        .register-box {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }
        .register-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .register-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.35rem; font-size: var(--text-sm); font-weight: 500; }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--text-sm);
            box-sizing: border-box;
        }
        .form-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
        .form-hint { font-size: var(--text-xs); color: var(--text-muted); margin-top: 0.25rem; }
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .checkbox-row input { margin-top: 0.2rem; }
        .checkbox-row a { color: var(--accent); text-decoration: none; }
        .checkbox-row a:hover { text-decoration: underline; }
        .btn-submit {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: var(--text-sm);
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--accent-dim); }
        .alert-error {
            padding: 0.7rem 1rem;
            background: rgba(248,113,113,0.15);
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--red);
            border-radius: 6px;
            font-size: var(--text-sm);
            margin-bottom: 1rem;
        }
        .login-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }
        .login-link a { color: var(--accent); text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-submit:disabled:hover {
            background: var(--accent);
        }
        .hp-field {
            position: absolute;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>
<body class="no-floating-chat">

<div class="register-box">
    <a th:href="@{/}" class="register-title" style="color: inherit; text-decoration: none;">
        <svg th:replace="~{fragments/logo :: mark(30)}"></svg>
        <span>OptiRent</span>
    </a>
    <h1 class="register-subtitle" style="font-weight: 400;">Регистрация нового аккаунта</h1>

    <th:block th:if="${registrationClosed}"><div th:replace="~{fragments/service :: notice(${serviceNotice})}"></div></th:block>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form method="post" th:action="@{/register}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="formToken" th:value="${formToken}">
        <!--/* Откуда пришёл (SignupSource): метки и домен перехода, без полного адреса */-->
        <input type="hidden" name="utm_source" th:if="${source.utmSource != null}" th:value="${source.utmSource}">
        <input type="hidden" name="utm_medium" th:if="${source.utmMedium != null}" th:value="${source.utmMedium}">
        <input type="hidden" name="utm_campaign" th:if="${source.utmCampaign != null}" th:value="${source.utmCampaign}">
        <input type="hidden" name="ref" th:if="${source.referrerDomain != null}" th:value="${source.referrerDomain}">
        <!-- Ловушка для ботов: людям поле не видно и с клавиатуры недоступно -->
        <div class="hp-field" aria-hidden="true">
            <label th:for="${honeypot}">Сайт компании</label>
            <input type="text" th:id="${honeypot}" th:name="${honeypot}" tabindex="-1" autocomplete="off">
        </div>

        <!--/* Регистрация закрыта выключателем «Сервис открыт» — поля неактивны; сервер тоже не примет */-->
        <fieldset class="service-locked" th:disabled="${registrationClosed}">
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" inputmode="email" class="form-input" required
                   th:value="${email}" autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label">Название вашей компании или ваше имя</label>
            <input type="text" name="tenantName" class="form-input" required
                   th:value="${tenantName}" autocomplete="organization"
                   placeholder="Например: Апартаменты у Кремля">
        </div>

        <div class="form-group">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-input" required
                   th:attr="minlength=${minLength}" autocomplete="new-password" aria-describedby="pw-rules">
            <div class="form-hint" id="pw-rules" th:text="${passwordRules}">Не короче 10 символов и не совпадает с адресом почты.</div>
        </div>

        <div class="form-group">
            <label class="form-label">Пароль ещё раз</label>
            <input type="password" name="confirmPassword" class="form-input" required
                   th:attr="minlength=${minLength}" autocomplete="new-password">
        </div>

        <th:block th:replace="~{fragments/legal :: account-checks}"></th:block>

        <button type="submit" class="btn-submit" id="submitBtn" disabled>Зарегистрироваться</button>
        </fieldset>

        <script>
        (function() {
            const checks = document.querySelectorAll('.reg-check');
            const btn = document.getElementById('submitBtn');
            function update() {
                btn.disabled = ![...checks].every(c => c.checked);
            }
            checks.forEach(c => c.addEventListener('change', update));
        })();
        </script>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
    </div>
</div>

</body>
</html>
