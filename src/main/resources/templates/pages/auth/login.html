<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — RentOptima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/core.css}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-title"><span style="color: var(--accent)">R</span>entOptima</div>
            <div class="login-subtitle">Система оптимизации посуточной аренды</div>

            <div th:if="${param.error}" class="login-error">
                Неверный логин или пароль
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Логин</label>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="admin" autofocus required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding: var(--sp-4);">
                    Войти
                </button>
            </form>
        </div>
    </div>
</body>
</html>
