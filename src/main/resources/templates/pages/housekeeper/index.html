<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзывы гостей</title>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; background: var(--bg); }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; }
        .feedback-item { border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: var(--bg-elevated); }
        .fb-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
        .guest-name { font-weight: 600; }
        .date { color: var(--text-muted); font-size: 0.85rem; }
        .scale-row { display: flex; gap: 0.5rem; margin: 0.25rem 0; font-size: 0.9rem; }
        .scale-label { color: var(--text-muted); flex: 1; }
        .scale-value { font-family: var(--font-mono); font-weight: 600; }
        .text-row { margin: 0.5rem 0; padding-left: 0.75rem; border-left: 2px solid var(--accent); }
        .text-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; }
        .text-value { font-size: 0.9rem; }
        .empty { color: var(--text-muted); text-align: center; padding: 3rem 1rem; }
    </style>
</head>
<body>

<h1>Отзывы гостей</h1>
<div class="subtitle" th:text="${property.name}">Объект</div>

<div th:if="${#lists.isEmpty(feedbacks)}" class="empty">
    Пока нет отзывов, доступных для просмотра.
</div>

<div th:each="item : ${feedbacks}" class="feedback-item">
    <div class="fb-header">
        <div class="guest-name" th:text="${item.response.guestName ?: 'Гость'}"></div>
        <div class="date" th:text="${#temporals.format(item.response.createdAt, 'dd.MM.yyyy')}"></div>
    </div>

    <div th:each="s : ${item.scales}" class="scale-row">
        <span class="scale-label" th:text="${s.question}"></span>
        <span class="scale-value" th:text="${s.value} + '/10'"></span>
    </div>

    <div th:each="t : ${item.texts}" class="text-row">
        <div class="text-label" th:text="${t.question}"></div>
        <div class="text-value" th:text="${t.value}"></div>
    </div>
</div>

</body>
</html>
