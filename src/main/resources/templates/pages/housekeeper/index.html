<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Уборка</title>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 1.5rem 1rem; background: var(--bg); color: var(--text); }
        h1 { margin-bottom: 0.25rem; color: var(--text); }
        .subtitle { color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .tab { padding: 0.75rem 1.25rem; text-decoration: none; color: var(--text-secondary); border-bottom: 2px solid transparent; font-size: 0.95rem; }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

        .booking { border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 0.75rem; background: var(--bg-elevated); }
        .booking-date { font-family: var(--font-mono); font-weight: 700; font-size: 1.25rem; color: var(--text); }
        .booking-guest { color: var(--text); margin-top: 0.25rem; }
        .booking-nights { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem; }

        .review { border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: var(--bg-elevated); }
        .review-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
        .review-guest { font-weight: 600; color: var(--text); }
        .review-date { color: var(--text-secondary); font-size: 0.85rem; }

        .scale-row { display: flex; gap: 0.5rem; margin: 0.25rem 0; font-size: 0.9rem; }
        .scale-label { color: var(--text); flex: 1; }
        .scale-value { font-family: var(--font-mono); font-weight: 600; color: var(--text); }

        .text-row { margin: 0.75rem 0; padding-left: 0.75rem; border-left: 2px solid var(--accent); }
        .text-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 0.25rem; }
        .text-value { font-size: 0.95rem; color: var(--text); line-height: 1.4; }

        .empty { color: var(--text-secondary); text-align: center; padding: 2rem 1rem; }
    </style>
</head>
<body>

<h1>Уборка</h1>
<div class="subtitle" th:text="${property.name}">Объект</div>

<div class="tabs">
    <a class="tab" th:href="@{'/housekeeper/' + ${code}}"
       th:classappend="${tab == 'schedule' ? 'active' : ''}">Расписание</a>
    <a class="tab" th:href="@{'/housekeeper/' + ${code} + '?tab=reviews'}"
       th:classappend="${tab == 'reviews' ? 'active' : ''}">Отзывы</a>
</div>

<!-- SCHEDULE TAB -->
<div th:if="${tab == 'schedule'}">
    <div th:if="${#lists.isEmpty(bookings)}" class="empty">
        Пока нет ближайших выездов и заездов.
    </div>

    <div th:each="b : ${bookings}" class="booking">
        <div class="booking-date" th:text="'Выезд ' + ${#temporals.format(b.checkOut, 'dd.MM')}"></div>
        <div class="booking-guest" th:text="${b.guestName ?: 'Гость'}"></div>
        <div class="booking-nights" th:text="'Заезд был: ' + ${#temporals.format(b.checkIn, 'dd.MM.yyyy')}"></div>
    </div>
</div>

<!-- REVIEWS TAB -->
<div th:if="${tab == 'reviews'}">
    <div th:if="${#lists.isEmpty(reviews)}" class="empty">
        Пока нет отзывов, доступных для просмотра.
    </div>

    <div th:each="item : ${reviews}" class="review">
        <div class="review-header">
            <div class="review-guest" th:text="${item.response.guestName ?: 'Гость'}"></div>
            <div class="review-date" th:text="${#temporals.format(item.response.createdAt, 'dd.MM.yyyy')}"></div>
        </div>

        <div th:each="s : ${item.scales}" class="scale-row">
            <span class="scale-label" th:text="${s.question}"></span>
            <span class="scale-value" th:text="${s.value} + '/10'"></span>
        </div>

        <div th:each="t : ${item.texts}" class="text-row">
            <div class="text-label" th:text="${t.question}"></div>
            <div class="text-value" th:text="${t.value}"></div>
        </div>
    </div>
</div>

</body>
</html>
