<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уборка</title>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            margin: 0 0 0.25rem 0;
            color: var(--text);
            font-size: 1.5rem;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.75rem 1.25rem;
            text-decoration: none;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .bell {
            width: 14px;
            height: 14px;
            color: #dc2626;
            animation: bell-shake 2s ease-in-out infinite;
        }
        @keyframes bell-shake {
            0%, 90%, 100% { transform: rotate(0); }
            2%, 6% { transform: rotate(-15deg); }
            4%, 8% { transform: rotate(15deg); }
        }

        /* Schedule list — reverse scroll (chat-like) */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .booking {
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            background: var(--bg-elevated);
            display: flex;
            gap: 0.85rem;
            align-items: flex-start;
        }
        .booking-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-soft, rgba(37, 99, 235, 0.1));
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .booking-body {
            flex: 1;
            min-width: 0;
        }
        .booking-date {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .booking-guest {
            color: var(--text);
            margin-top: 0.15rem;
            font-size: 0.95rem;
        }
        .booking-nights {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }

        /* Reviews */
        .review {
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.85rem;
            background: var(--bg-elevated);
        }
        .review.fresh {
            border-color: #dc2626;
            border-width: 2px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }
        .review-guest {
            font-weight: 600;
            color: var(--text);
        }
        .review-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .scale-row {
            display: flex;
            gap: 0.5rem;
            margin: 0.35rem 0;
            font-size: 0.9rem;
        }
        .scale-label {
            color: var(--text);
            flex: 1;
        }
        .scale-value {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--text);
        }

        .text-row {
            margin: 0.75rem 0;
            padding-left: 0.75rem;
            border-left: 2px solid var(--accent);
        }
        .text-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .text-value {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.45;
        }

        .empty {
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem 1rem;
        }

        @media (max-width: 480px) {
            body { padding: 0.75rem; }
            h1 { font-size: 1.3rem; }
            .tab { padding: 0.65rem 0.9rem; font-size: 0.9rem; }
            .booking { padding: 0.85rem; gap: 0.7rem; }
            .booking-icon { width: 32px; height: 32px; }
            .booking-date { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<h1>Уборка</h1>
<div class="subtitle" th:text="${property.name}">Объект</div>

<div class="tabs">
    <a class="tab" th:href="@{'/housekeeper/' + ${code}}"
       th:classappend="${tab == 'schedule' ? 'active' : ''}">Расписание</a>
    <a class="tab" th:href="@{'/housekeeper/' + ${code} + '?tab=reviews'}"
       th:classappend="${tab == 'reviews' ? 'active' : ''}">
        Отзывы
        <svg th:if="${hasFreshReview}" class="bell" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a1 1 0 011 1v1.07A7 7 0 0119 11v3.28l1.71 3.42A1 1 0 0119.81 19H4.19a1 1 0 01-.9-1.3L5 14.28V11a7 7 0 016-6.93V3a1 1 0 011-1zm-2 18h4a2 2 0 01-4 0z"/>
        </svg>
    </a>
</div>

<!-- SCHEDULE TAB -->
<div th:if="${tab == 'schedule'}">
    <div th:if="${#lists.isEmpty(bookings)}" class="empty">
        Пока нет ближайших выездов и заездов.
    </div>

    <div class="schedule-list" th:unless="${#lists.isEmpty(bookings)}">
        <div th:each="b : ${bookings}" class="booking">
            <div class="booking-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="booking-body">
                <div class="booking-date" th:text="'Выезд ' + ${#temporals.format(b.checkOut, 'dd.MM')}"></div>
                <div class="booking-guest" th:text="${b.guestName ?: 'Гость'}"></div>
                <div class="booking-nights" th:text="'Заезд был: ' + ${#temporals.format(b.checkIn, 'dd.MM.yyyy')}"></div>
            </div>
        </div>
    </div>
</div>

<!-- REVIEWS TAB -->
<div th:if="${tab == 'reviews'}">
    <div th:if="${#lists.isEmpty(reviews)}" class="empty">
        Пока нет отзывов, доступных для просмотра.
    </div>

    <div th:each="item : ${reviews}" class="review" th:classappend="${item.isFresh ? 'fresh' : ''}">
        <div class="review-header">
            <div class="review-guest" th:text="${item.response.guestName ?: 'Гость'}"></div>
            <div class="review-date" th:text="${#temporals.format(item.response.createdAt, 'dd.MM.yyyy')}"></div>
        </div>

        <div th:each="s : ${item.scales}" class="scale-row">
            <span class="scale-label" th:text="${s.question}"></span>
            <span class="scale-value" th:text="${s.value} + '/10'"></span>
        </div>

        <div th:each="t : ${item.texts}" class="text-row">
            <div class="text-label" th:text="${t.question}"></div>
            <div class="text-value" th:text="${t.value}"></div>
        </div>
    </div>
</div>

</body>
</html>
