<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступ горничной</title>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { max-width: 340px; padding: 2rem; text-align: center; }
        .pin-input { font-size: 2rem; letter-spacing: 0.5rem; text-align: center; width: 100%; padding: 1rem; }
        .error { color: var(--rose); margin-top: 0.5rem; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="login-card card">
    <h2>PIN горничной</h2>
    <form th:action="@{'/housekeeper/' + ${code} + '/login'}" method="post">
        <input class="pin-input" type="password" name="pin" placeholder="••••" maxlength="8" autofocus>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Войти</button>
    </form>
    <div class="error" th:if="${param.error}">Неверный PIN</div>
</div>
</body>
</html>
