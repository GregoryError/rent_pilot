<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Расходы</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header flex justify-between items-center">
        <div>
            <h1 class="page-title">Расходы</h1>
            <p class="page-subtitle" th:text="'Итого за месяц: ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></p>
        </div>
        <button class="btn btn-primary" onclick="document.getElementById('add-form').style.display='block'">+ Добавить</button>
    </div>

    <!-- Add form (hidden by default) -->
    <div class="card" id="add-form" style="display:none">
        <div class="card__title" style="margin-bottom: var(--sp-4)">Новый расход</div>
        <form th:action="@{/expenses}" method="post" style="display:flex; flex-wrap:wrap; gap: var(--sp-4); align-items: flex-end;">
            <input type="hidden" name="propertyId" value="1">
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label">Категория</label>
                <select name="categoryId" class="form-input form-input--sm" style="width:200px">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label">Сумма, ₽</label>
                <input type="number" name="amount" class="form-input form-input--sm" style="width:120px" required>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label">Дата</label>
                <input type="date" name="date" class="form-input form-input--sm" style="width:160px"
                       th:value="${T(java.time.LocalDate).now()}" required>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label">Комментарий</label>
                <input type="text" name="comment" class="form-input form-input--sm" style="width:250px" placeholder="Необязательно">
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>

    <!-- Expenses table -->
    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Категория</th>
                        <th>Комментарий</th>
                        <th class="text-right">Сумма</th>
                        <th>Авто</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exp : ${expenses}">
                        <td th:text="${exp.date}"></td>
                        <td>
                            <th:block th:each="cat : ${categories}" th:if="${cat.id == exp.categoryId}" th:text="${cat.name}"></th:block>
                        </td>
                        <td class="muted" th:text="${exp.comment ?: '—'}"></td>
                        <td class="text-right mono" th:text="${#numbers.formatDecimal(exp.amount, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></td>
                        <td>
                            <span th:if="${exp.autoGenerated}" class="tag tag--muted">авто</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expenses)}">
                        <td colspan="5" class="muted" style="text-align:center">Нет расходов за этот месяц</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
