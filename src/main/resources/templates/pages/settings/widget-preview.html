<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Предпросмотр виджета</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header flex justify-between items-center" style="gap: var(--sp-3); flex-wrap: wrap;">
        <div>
            <h1 class="page-title">Новый виджет — предпросмотр</h1>
            <p class="page-subtitle">Так страницу бронирования увидит гость. Заявки отсюда настоящие: попадут в «Заявки» и закроют даты</p>
        </div>
        <a class="btn btn-ghost" th:href="@{'/settings/widgets/' + ${w.id}}">← К настройкам</a>
    </div>

    <optirent-booking th:data-widget="${w.slug}"></optirent-booking>

</div>

<th:block layout:fragment="scripts">
    <script async th:src="@{/w.js}"></script>
</th:block>
</body>
</html>
