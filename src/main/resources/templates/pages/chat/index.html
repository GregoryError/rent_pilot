<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>AI Чат</title>
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--sp-4) 0;
        }
        .chat-msg {
            margin-bottom: var(--sp-5);
            max-width: 85%;
        }
        .chat-msg--user {
            margin-left: auto;
        }
        .chat-msg__role {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-muted);
            margin-bottom: var(--sp-1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .chat-msg__body {
            padding: var(--sp-4);
            border-radius: var(--radius);
            font-size: var(--text-sm);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .chat-msg--user .chat-msg__body {
            background: var(--accent-glow);
            border: 1px solid rgba(108,140,255,0.2);
        }
        .chat-msg--ai .chat-msg__body {
            background: var(--bg-raised);
            border: 1px solid var(--border-subtle);
        }
        .chat-input-row {
            display: flex;
            gap: var(--sp-3);
            padding-top: var(--sp-4);
            border-top: 1px solid var(--border-subtle);
        }
        .chat-input {
            flex: 1;
            padding: var(--sp-3) var(--sp-4);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: var(--text-base);
            font-family: var(--font-sans);
            outline: none;
            resize: none;
        }
        .chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .chat-send {
            padding: var(--sp-3) var(--sp-6);
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: var(--weight-medium);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: var(--text-sm);
        }
        .chat-send:hover { background: var(--accent-dim); }
        .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
        .chat-typing {
            font-size: var(--text-xs);
            color: var(--text-muted);
            padding: var(--sp-2) 0;
        }
        .chat-tokens {
            font-size: var(--text-xs);
            color: var(--text-muted);
            text-align: right;
            margin-top: var(--sp-1);
        }
        .chat-hints {
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-2);
            margin-bottom: var(--sp-4);
        }
        .chat-hint {
            padding: var(--sp-2) var(--sp-3);
            background: var(--bg-raised);
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .chat-hint:hover { border-color: var(--accent); color: var(--accent); }

        /* Action confirmation card */
        .action-confirm {
            margin-top: var(--sp-3);
            padding: var(--sp-4);
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: var(--radius-sm);
        }
        .action-confirm__title {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--amber);
            margin-bottom: var(--sp-2);
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }
        .action-confirm__desc {
            font-size: var(--text-sm);
            color: var(--text-primary);
            margin-bottom: var(--sp-3);
        }
        .action-confirm__details {
            font-size: var(--text-xs);
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-bottom: var(--sp-3);
            padding: var(--sp-2);
            background: var(--bg-raised);
            border-radius: var(--radius-sm);
        }
        .action-confirm__buttons { display: flex; gap: var(--sp-2); }
        .action-btn {
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            font-family: var(--font-sans);
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-raised);
            color: var(--text-primary);
        }
        .action-btn--apply { background: var(--amber); color: #000; border-color: var(--amber); }
        .action-btn--apply:hover { opacity: 0.9; }
        .action-btn--cancel:hover { border-color: var(--red); color: var(--red); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .action-applied {
            padding: var(--sp-2);
            background: rgba(74,222,128,0.15);
            color: var(--green);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            text-align: center;
        }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">AI Чат</h1>
        <p class="page-subtitle">Аналитик с контекстом ваших данных</p>
    </div>

    <div class="chat-container">
        <div class="chat-hints" id="hints">
            <div class="chat-hint" onclick="sendHint(this)">Как увеличить среднюю длительность проживания?</div>
            <div class="chat-hint" onclick="sendHint(this)">Проанализируй текущий месяц</div>
            <div class="chat-hint" onclick="sendHint(this)">Подними цены на выходные октября на 10%</div>
            <div class="chat-hint" onclick="sendHint(this)">Что добавить в квартиру для повышения дохода?</div>
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="chat-input-row">
            <textarea class="chat-input" id="input" rows="1" placeholder="Задайте вопрос..."
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
            <button class="chat-send" id="sendBtn" onclick="send()">Отправить</button>
        </div>
    </div>

</div>

<div layout:fragment="scripts">
<script th:inline="javascript">
const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const hintsEl = document.getElementById('hints');
let history = [];
let totalTokens = 0;

function addMessage(role, content, action) {
    const div = document.createElement('div');
    div.className = 'chat-msg chat-msg--' + (role === 'user' ? 'user' : 'ai');
    let html = `
        <div class="chat-msg__role">${role === 'user' ? 'Вы' : 'AI'}</div>
        <div class="chat-msg__body">${escapeHtml(content)}</div>
    `;
    div.innerHTML = html;

    if (action) {
        const conf = document.createElement('div');
        conf.className = 'action-confirm';
        conf.innerHTML = renderActionConfirm(action);
        div.appendChild(conf);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (action) {
        const btnApply = div.querySelector('.action-btn--apply');
        const btnCancel = div.querySelector('.action-btn--cancel');
        btnApply.onclick = () => applyAction(div, action);
        btnCancel.onclick = () => { div.querySelector('.action-confirm').remove(); };
    }
}

function renderActionConfirm(action) {
    const desc = action.description || describeAction(action);
    const params = action.params || {};
    const details = Object.entries(params)
        .map(([k, v]) => `${k}: ${v}`)
        .join(' · ');
    const expires = action.expires_at ? `до ${action.expires_at}` : 'бессрочно';

    return `
        <div class="action-confirm__title">⚙ Требуется подтверждение</div>
        <div class="action-confirm__desc">${escapeHtml(desc)}</div>
        <div class="action-confirm__details">${escapeHtml(details)} · ${escapeHtml(expires)}</div>
        <div class="action-confirm__buttons">
            <button class="action-btn action-btn--apply">Применить</button>
            <button class="action-btn action-btn--cancel">Отмена</button>
        </div>
    `;
}

function describeAction(action) {
    if (action.type === 'price_multiplier') {
        const p = action.params || {};
        const pct = Math.round(((p.factor || 1) - 1) * 100);
        return `Умножить цены на ${p.factor} (${pct > 0 ? '+' : ''}${pct}%) с ${p.from} по ${p.to}`;
    }
    return action.type;
}

async function applyAction(container, action) {
    const buttons = container.querySelectorAll('.action-btn');
    buttons.forEach(b => b.disabled = true);
    try {
        const headers = { 'Content-Type': 'application/json' };
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        const resp = await fetch('/api/chat/apply-action', {
            method: 'POST',
            headers,
            body: JSON.stringify({ actionJson: JSON.stringify(action) })
        });
        const data = await resp.json();

        const conf = container.querySelector('.action-confirm');
        if (data.status === 'applied') {
            conf.innerHTML = `<div class="action-applied">✓ Применено. Автопилот учтёт при следующем цикле.</div>`;
        } else {
            conf.innerHTML = `<div class="action-applied" style="background: rgba(248,113,113,0.15); color: var(--red);">Ошибка: ${data.error || 'неизвестная'}</div>`;
        }
    } catch (e) {
        alert('Не удалось применить: ' + e.message);
        buttons.forEach(b => b.disabled = false);
    }
}

function escapeHtml(text) {
    if (text == null) return '';
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = '';
    hintsEl.style.display = 'none';
    addMessage('user', msg);
    sendBtn.disabled = true;

    const typing = document.createElement('div');
    typing.className = 'chat-typing';
    typing.textContent = 'AI думает...';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
        const headers = { 'Content-Type': 'application/json' };
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers,
            body: JSON.stringify({ message: msg, history })
        });
        const data = await resp.json();

        typing.remove();
        addMessage('ai', data.content, data.action);
        totalTokens += data.tokens;

        history.push({ role: 'user', content: msg });
        history.push({ role: 'assistant', content: data.content });

        if (history.length > 20) history = history.slice(-20);
    } catch (e) {
        typing.remove();
        addMessage('ai', 'Ошибка соединения: ' + e.message);
    }

    sendBtn.disabled = false;
    inputEl.focus();
}

function sendHint(el) {
    inputEl.value = el.textContent;
    send();
}
</script>
</div>
</body>
</html>
