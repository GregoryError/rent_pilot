<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Бронирование</title>
    <meta name="description" th:content="${shareDescription}">
    <meta name="theme-color" th:content="${themeColor}">
    <link rel="canonical" th:href="${pageUrl}">
    <meta name="robots" content="noindex, nofollow" th:unless="${indexed}">
    <th:block th:unless="${embed}">
        <link rel="icon" href="/favicon.ico" sizes="48x48">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    </th:block>
    <!-- Превью ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OptiRent">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" th:content="${widget.title}">
    <meta property="og:description" th:content="${shareDescription}">
    <meta property="og:url" th:content="${pageUrl}">
    <meta property="og:image" th:if="${shareImage != null}" th:content="${shareImage}">
    <meta name="twitter:card" th:content="${shareImage != null ? 'summary_large_image' : 'summary'}">
    <meta name="twitter:title" th:content="${widget.title}">
    <meta name="twitter:description" th:content="${shareDescription}">
    <meta name="twitter:image" th:if="${shareImage != null}" th:content="${shareImage}">
    <!-- Микроразметка жилья: только то, что видно на странице; рейтингов и отзывов нет -->
    <script type="application/ld+json" th:if="${jsonLd != null}" th:utext="${jsonLd}"></script>
    <link rel="preload" as="font" type="font/woff2" crossorigin th:each="f : ${fontFiles}" th:href="${f}">
    <!--/* У страницы задан счётчик Метрики хозяина: виджет загрузит его только после согласия
         посетителя (consent.js). Нет счётчика — нет ни баннера, ни этого кода. */-->
    <th:block th:if="${!#strings.isEmpty(widget.metrikaId)}">
        <script>window.optirentAnalyticsConsent = new Promise(function (resolve) { window.__optirentConsentResolve = resolve; });</script>
        <script defer th:src="@{/js/consent.js}" data-widget></script>
    </th:block>
    <style>
        html, body { margin: 0; }
        body { background: #f6f5f2; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
        .page--dark { background: #0e0f11; }
        @media (prefers-color-scheme: dark) { .page--auto { background: #0e0f11; } }
        .page-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
        @media (max-width: 600px) { .page-wrap { padding: 12px 8px 32px; } }
        /* Во фрейме на сайте хозяина — без своего фона и полей */
        .embed { background: transparent; }
        .embed .page-wrap { max-width: none; padding: 0; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        /* Серверный текст о жилье: виден и без скрипта, и поисковику */
        .about { max-width: 720px; margin: 32px auto 0; padding: 0 8px; font-size: 1rem; line-height: 1.6; color: #1b1b19; }
        .about h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 12px; }
        .about h3 { font-size: 1rem; margin: 20px 0 6px; }
        .about p { margin: 0 0 10px; white-space: pre-line; overflow-wrap: anywhere; }
        .about ul { margin: 0; padding-left: 20px; }
        .about li { margin: 2px 0; }
        .page--dark .about { color: #e8e6e1; }
        @media (prefers-color-scheme: dark) { .page--auto .about { color: #e8e6e1; } }
        noscript p { max-width: 560px; margin: 48px auto; padding: 0 16px; font-size: 1rem; line-height: 1.5; color: #1b1b19; }
    </style>
</head>
<body th:class="${pageClass}">
<main class="page-wrap">
    <h1 class="sr-only" th:text="${widget.title}">Бронирование</h1>
    <!-- Настройки виджета встроены в страницу: он рисуется сразу, без запроса и без скелетона -->
    <script type="application/json" th:attr="data-optirent-config=${widget.slug}" th:utext="${configJson}"></script>
    <optirent-booking th:data-widget="${widget.slug}" data-vt></optirent-booking>
    <noscript><p>Чтобы выбрать даты и отправить заявку, включите JavaScript в браузере.</p></noscript>
    <section class="about" th:if="${about != null and !about.empty}">
        <h2 th:text="${widget.title}">Квартира</h2>
        <p th:if="${about.address != null}" th:text="${about.address}">Центр, у парка</p>
        <p th:if="${about.description != null}" th:text="${about.description}">Описание</p>
        <th:block th:unless="${#lists.isEmpty(about.amenities)}">
            <h3>Удобства</h3>
            <ul><li th:each="a : ${about.amenities}" th:text="${a}">Wi-Fi</li></ul>
        </th:block>
        <th:block th:if="${about.rules != null}">
            <h3>Правила проживания</h3>
            <p th:text="${about.rules}">Правила</p>
        </th:block>
        <th:block th:if="${about.cancellation != null}">
            <h3>Условия отмены</h3>
            <p th:text="${about.cancellation}">Отмена</p>
        </th:block>
    </section>
</main>
<script async th:src="@{/w.js}"></script>
<!-- Фрейм сообщает странице хозяина свою высоту, чтобы та подогнала его без прокрутки -->
<script th:if="${embed}" th:inline="javascript">
    (function () {
        var slug = /*[[${widget.slug}]]*/ 'slug';
        var last = 0;
        function report() {
            var height = Math.ceil(document.documentElement.getBoundingClientRect().height);
            if (height === last) return;
            last = height;
            parent.postMessage({ optirent: slug, height: height }, '*');
        }
        new ResizeObserver(report).observe(document.documentElement);
        addEventListener('load', report);
    })();
</script>
</body>
</html>
