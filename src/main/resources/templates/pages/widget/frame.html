<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="${widget.title}">Бронирование</title>
    <link rel="stylesheet" th:href="@{/css/widget.css}">
    <style>
        html, body { margin: 0; padding: 0; background: transparent; }
        body { padding: 4px; }
    </style>
</head>
<body>
<div id="optirent-widget" th:data-secret="${widget.secret}" th:data-base-url="${baseUrl}"></div>
<script th:src="@{/js/widget-core.js}"></script>
<script>
    (function () {
        var node = document.getElementById('optirent-widget');
        OptiRentWidget.mount(node, { baseUrl: node.dataset.baseUrl, secret: node.dataset.secret });
    })();
</script>
</body>
</html>
