<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${widget.title}">Бронирование</title>
    <meta name="description" th:content="${ogDescription}">
    <meta property="og:title" th:content="${widget.title}">
    <meta property="og:description" th:content="${ogDescription}">
    <meta property="og:image" th:if="${firstPhoto != null}" th:content="${firstPhoto}">
    <meta property="og:url" th:content="${currentUrl}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" th:content="${firstPhoto != null ? 'summary_large_image' : 'summary'}">
    <link rel="stylesheet" th:href="@{/css/widget.css}">
    <style>
        .book-page { --bp-bg: #f6f5f2; --bp-text: #1c1c1a; --bp-muted: #6f6e68; --bp-border: #e2e1dc; --bp-surface: #ffffff; }
        .book-page--dark { --bp-bg: #0e0f11; --bp-text: #ececec; --bp-muted: #9a9ba3; --bp-border: #2c2e36; --bp-surface: #17181c; }
        @media (prefers-color-scheme: dark) {
            .book-page--auto { --bp-bg: #0e0f11; --bp-text: #ececec; --bp-muted: #9a9ba3; --bp-border: #2c2e36; --bp-surface: #17181c; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bp-bg); color: var(--bp-text);
               font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
        .bp { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
        .bp h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 6px; }
        .bp__hint { color: var(--bp-muted); margin-bottom: 20px; }
        .bp__photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 24px; }
        .bp__photos img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; display: block; background: var(--bp-border); }
        .bp__cols { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 32px; align-items: start; }
        .bp__section { margin-bottom: 24px; }
        .bp__section h2 { font-size: 1.05rem; margin: 0 0 8px; }
        .bp__text { white-space: pre-line; overflow-wrap: anywhere; }
        .bp__times { display: flex; gap: 12px; flex-wrap: wrap; }
        .bp__time { background: var(--bp-surface); border: 1px solid var(--bp-border); border-radius: 10px; padding: 10px 14px; }
        .bp__time span { display: block; font-size: 0.8rem; color: var(--bp-muted); }
        .bp__time strong { font-variant-numeric: tabular-nums; }
        .bp__widget { position: sticky; top: 16px; }
        @media (max-width: 860px) {
            .bp__cols { grid-template-columns: minmax(0, 1fr); }
            .bp__widget { position: static; order: -1; }
        }
    </style>
</head>
<body th:class="${bodyClass}">
<div class="bp">
    <h1 th:text="${widget.title}">Квартира на Садовой</h1>
    <div class="bp__hint" th:if="${widget.addressHint != null}" th:text="${widget.addressHint}">Центр, у метро</div>

    <div class="bp__photos" th:unless="${#lists.isEmpty(photos)}">
        <img th:each="p : ${photos}" th:src="${p}" alt="" loading="lazy" referrerpolicy="no-referrer">
    </div>

    <div class="bp__cols">
        <div>
            <div class="bp__section" th:if="${widget.description != null}">
                <h2>Описание</h2>
                <div class="bp__text" th:text="${widget.description}"></div>
            </div>
            <div class="bp__section">
                <h2>Заезд и выезд</h2>
                <div class="bp__times">
                    <div class="bp__time"><span>Заезд с</span><strong th:text="${checkin}">14:00</strong></div>
                    <div class="bp__time"><span>Выезд до</span><strong th:text="${checkout}">12:00</strong></div>
                </div>
            </div>
            <div class="bp__section" th:if="${widget.rules != null}">
                <h2>Правила проживания</h2>
                <div class="bp__text" th:text="${widget.rules}"></div>
            </div>
            <div class="bp__section" th:if="${widget.cancellationPolicy != null}">
                <h2>Отмена бронирования</h2>
                <div class="bp__text" th:text="${widget.cancellationPolicy}"></div>
            </div>
        </div>

        <div class="bp__widget">
            <div id="optirent-widget" th:data-secret="${widget.secret}" th:data-base-url="${baseUrl}"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/widget-core.js}"></script>
<script>
    (function () {
        var node = document.getElementById('optirent-widget');
        OptiRentWidget.mount(node, { baseUrl: node.dataset.baseUrl, secret: node.dataset.secret, showTitle: false });
    })();
</script>
</body>
</html>
