<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Сменить пароль</title>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Сменить пароль</h1>
        <p class="page-subtitle">После смены все остальные входы в аккаунт завершатся, на почту придёт уведомление.</p>
    </div>

    <div class="card account-form">
        <div th:if="${changed}" class="login-ok" role="status">Пароль изменён. Остальные входы в аккаунт завершены.</div>
        <div th:if="${pwError}" class="login-error" role="alert" th:text="${pwError}"></div>

        <form th:action="@{/account/password}" method="post">
            <div class="form-group">
                <label class="form-label" for="currentPassword">Текущий пароль</label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-input" required
                       autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Новый пароль</label>
                <input type="password" id="password" name="password" class="form-input" required
                       th:attr="minlength=${minLength}" autocomplete="new-password" aria-describedby="pw-rules">
            </div>
            <p class="pw-rules" id="pw-rules" th:text="${rules}"></p>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Новый пароль ещё раз</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required
                       th:attr="minlength=${minLength}" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Сменить пароль</button>
        </form>
        <p class="form-hint">Не помните текущий пароль? <a th:href="@{/forgot}">Восстановите его по почте</a>.</p>
    </div>
</div>
</body>
</html>
