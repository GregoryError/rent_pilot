<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${doc.title} + ' — OptiRent'">Документ — OptiRent</title>
    <meta name="theme-color" content="#f6f5f2">
    <meta name="robots" content="noindex, nofollow" th:if="${noindex}">
    <th:block th:replace="~{fragments/site :: social(${doc.title} + ' — OptiRent', ${description}, ${canonical}, null)}"></th:block>
    <th:block th:replace="~{fragments/site :: icons}"></th:block>
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <link rel="stylesheet" th:href="@{/css/legal.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="legal">

<header class="legal-header">
    <a href="/" class="legal-brand"><svg th:replace="~{fragments/logo :: mark(24)}"></svg><span>OptiRent</span></a>
    <a href="/" class="legal-back">← На главную</a>
</header>

<main>
    <h1 class="legal-title" th:text="${doc.title}">Документ</h1>
    <p class="legal-subtitle" th:if="${subtitle != null}" th:text="|Страница бронирования «${subtitle}»|"></p>
    <p class="legal-meta">
        Редакция <span th:text="${doc.version}">1</span> · действует с <span th:text="${effective}">1 января</span>
    </p>
    <p class="legal-archived" th:if="${archived}">
        Это прежняя редакция документа. <a th:href="${currentPath}">Действующая редакция</a>
    </p>

    <nav class="legal-toc" th:if="${!toc.isEmpty()}" aria-label="Содержание">
        <div class="legal-toc__title">Содержание</div>
        <ol>
            <li th:each="item : ${toc}"><a th:href="'#' + ${item.id}" th:text="${item.text}">Раздел</a></li>
        </ol>
    </nav>

    <article class="legal-content" th:utext="${htmlContent}"></article>

    <section class="legal-history" th:if="${!history.isEmpty()}">
        <h2>Редакции документа</h2>
        <ul>
            <li th:each="row : ${history}">
                <span th:if="${row.shown}" th:text="${row.label}" aria-current="page">Редакция 1</span>
                <a th:unless="${row.shown}" th:href="${row.path}" th:text="${row.label}">Редакция 1</a>
            </li>
        </ul>
    </section>
</main>

<footer class="legal-footer">
    <ul>
        <li th:each="r : ${related}"><a th:href="${r[0]}" th:text="${r[1]}">Документ</a></li>
    </ul>
    <p><span th:text="${legalOperator.line}">Оператор</span> · <a th:href="'mailto:' + ${legalOperator.email}" th:text="${legalOperator.email}">e-mail</a></p>
</footer>

</body>
</html>
