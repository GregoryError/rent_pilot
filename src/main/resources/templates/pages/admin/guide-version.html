<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Версия статьи</title>
    <link rel="stylesheet" th:href="@{/css/legal.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="|Версия ${v.version}: ${v.form.title}|">Версия</h1>
        <p class="page-subtitle">
            <span th:text="${when}">дата</span><span th:if="${v.author != null}" th:text="|, ${v.author}|"></span>
            · <a th:href="@{'/admin/guides/' + ${guide.id} + '/edit'}">← В редактор</a>
        </p>
    </div>
    <div class="card">
        <p class="muted" th:text="|/instrukcii/${v.form.slug} · ${v.form.description}|"></p>
        <div class="legal-content" th:utext="${html}"></div>
    </div>
    <form method="post" th:action="@{'/admin/guides/' + ${guide.id} + '/restore/' + ${v.version}}"
          onsubmit="return confirm('Загрузить эту версию в редактор? Текущая рабочая копия будет заменена (она есть в истории, если её сохраняли).');">
        <button type="submit" class="btn btn-primary">Восстановить эту версию</button>
    </form>
</div>
</body>
</html>
