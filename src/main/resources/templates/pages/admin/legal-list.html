<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Правовые страницы</title>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Правовые страницы</h1>
        <p class="page-subtitle">Редактирование политики, оферты и других правовых текстов</p>
    </div>

    <div class="card">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
            <tr style="border-bottom: 1px solid var(--border);">
                <th style="text-align: left; padding: 0.75rem 0.5rem; font-size: var(--text-sm); color: var(--text-secondary);">Название</th>
                <th style="text-align: left; padding: 0.75rem 0.5rem; font-size: var(--text-sm); color: var(--text-secondary);">Slug</th>
                <th style="text-align: left; padding: 0.75rem 0.5rem; font-size: var(--text-sm); color: var(--text-secondary);">Обновлено</th>
                <th style="text-align: right; padding: 0.75rem 0.5rem;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pages}" style="border-bottom: 1px solid var(--border-subtle);">
                <td style="padding: 0.75rem 0.5rem;">
                    <a th:href="@{'/legal/' + ${p.slug}}" target="_blank" style="color: var(--text-primary); text-decoration: none;"
                       th:text="${p.title}"></a>
                </td>
                <td style="padding: 0.75rem 0.5rem; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-muted);"
                    th:text="${p.slug}"></td>
                <td style="padding: 0.75rem 0.5rem; color: var(--text-secondary); font-size: var(--text-sm);"
                    th:text="${#temporals.format(p.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td style="text-align: right; padding: 0.75rem 0.5rem;">
                    <a th:href="@{'/admin/legal-pages/' + ${p.slug} + '/edit'}" class="btn btn-sm">Редактировать</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
