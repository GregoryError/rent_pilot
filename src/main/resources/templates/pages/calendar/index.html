<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Календарь</title>
    <style>
        .cal-nav { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-6); }
        .cal-nav a { color: var(--text-secondary); font-size: var(--text-lg); text-decoration: none; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); }
        .cal-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
        .cal-month { font-size: var(--text-xl); font-weight: var(--weight-semibold); min-width: 250px; text-align: center; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: var(--border-subtle);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .cal-header {
            background: var(--bg-raised);
            padding: var(--sp-3);
            text-align: center;
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .cal-day {
            background: var(--bg-surface);
            padding: var(--sp-2) var(--sp-3);
            min-height: 90px;
            position: relative;
        }
        .cal-day--empty { background: var(--bg-root); }
        .cal-day--today { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
        .cal-day--past { opacity: 0.6; }

        .cal-num {
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
        }
        .cal-num--weekend { color: var(--red); }
        .cal-num--holiday { color: var(--amber); }

        /* Booked day — solid colored block */
        .cal-booked {
            margin-top: 4px;
            padding: 4px 6px;
            background: rgba(108,140,255,0.2);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-booked--checkin { border-left-color: var(--green); }

        /* Gap — red warning */
        .cal-gap {
            margin-top: 4px;
            padding: 4px 6px;
            background: rgba(248,113,113,0.2);
            border-left: 3px solid var(--red);
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--red);
        }

        /* Free day — just price text */
        .cal-free-price {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .cal-holiday-label {
            font-size: 0.6rem;
            color: var(--amber);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cal-legend {
            display: flex; gap: var(--sp-6); margin-top: var(--sp-5);
            font-size: var(--text-xs); color: var(--text-secondary);
        }
        .cal-legend span { display: flex; align-items: center; gap: var(--sp-2); }
        .cal-legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Календарь</h1>
        <p class="page-subtitle" th:if="${property != null}" th:text="${property.name}"></p>
    </div>

    <div class="cal-nav">
        <a th:href="@{/calendar(year=${prevYear},month=${prevMonth})}">◂</a>
        <div class="cal-month" th:text="${monthName}"></div>
        <a th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">▸</a>
    </div>

    <div th:if="${property == null}" class="card" style="text-align:center; padding: var(--sp-10);">
        <div class="muted">Добавьте объект в <a th:href="@{/settings/properties}">настройках</a></div>
    </div>

    <th:block th:if="${property != null}">
        <div class="cal-grid">
            <div class="cal-header">Пн</div><div class="cal-header">Вт</div><div class="cal-header">Ср</div>
            <div class="cal-header">Чт</div><div class="cal-header">Пт</div>
            <div class="cal-header" style="color:var(--red)">Сб</div>
            <div class="cal-header" style="color:var(--red)">Вс</div>

            <!-- Empty cells before first day -->
            <th:block th:if="${!#lists.isEmpty(days)}">
                <th:block th:with="offset=${days[0].dayOfWeek() - 1}">
                    <div th:each="i : ${#numbers.sequence(1, offset)}" class="cal-day cal-day--empty" th:if="${offset > 0}"></div>
                </th:block>
            </th:block>

            <!-- Days -->
            <div th:each="day : ${days}" class="cal-day"
                 th:classappend="${day.today() ? ' cal-day--today' : ''} + ${day.past() ? ' cal-day--past' : ''}">

                <!-- Day number -->
                <div class="cal-num"
                     th:classappend="${day.holiday() ? ' cal-num--holiday' : (day.weekend() ? ' cal-num--weekend' : '')}"
                     th:text="${day.dayOfMonth()}"></div>

                <!-- Holiday label -->
                <div th:if="${day.holidayName() != null}" class="cal-holiday-label" th:text="${day.holidayName()}" th:title="${day.holidayName()}"></div>

                <!-- BOOKED -->
                <th:block th:if="${day.status() == 'booked'}">
                    <div class="cal-booked" th:classappend="${day.checkIn() ? ' cal-booked--checkin' : ''}"
                         th:title="${(day.guestName() ?: 'Гость') + ' | ' + (day.source() ?: '')}">
                        <span th:text="${day.guestName() ?: day.source() ?: 'Бронь'}"></span>
                    </div>
                </th:block>

                <!-- GAP -->
                <th:block th:if="${day.status() == 'gap'}">
                    <div class="cal-gap">⚠ дыра</div>
                </th:block>

                <!-- FREE (future only) -->
                <th:block th:if="${day.status() == 'free' && !day.past()}">
                    <div class="cal-free-price" th:text="${day.basePrice()} + ' ₽'"></div>
                </th:block>
            </div>
        </div>

        <div class="cal-legend">
            <span><div class="cal-legend-dot" style="background:rgba(108,140,255,0.3); border-left:3px solid var(--accent);"></div> Бронь</span>
            <span><div class="cal-legend-dot" style="background:rgba(248,113,113,0.3); border-left:3px solid var(--red);"></div> Gap (дыра)</span>
            <span><div class="cal-legend-dot" style="background:var(--amber);"></div> Праздник</span>
            <span><div class="cal-legend-dot" style="background:var(--green);"></div> Заезд</span>
        </div>
    </th:block>

</div>
</body>
</html>
