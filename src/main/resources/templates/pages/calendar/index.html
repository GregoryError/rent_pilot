<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Календарь</title>
    <style>
        .cal-nav { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-6); }
        .cal-nav a { color: var(--text-secondary); font-size: var(--text-lg); text-decoration: none; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); }
        .cal-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
        .cal-month { font-size: var(--text-xl); font-weight: var(--weight-semibold); min-width: 250px; text-align: center; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: var(--border-subtle);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .cal-header {
            background: var(--bg-raised);
            padding: var(--sp-3);
            text-align: center;
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .cal-day {
            background: var(--bg-surface);
            padding: 6px 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
            overflow: hidden;
        }
        .cal-day--empty { background: var(--bg-root); }
        .cal-day--today { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
        .cal-day--past { opacity: 0.6; }

        .cal-day-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 4px;
        }
        .cal-num {
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
            line-height: 1;
        }
        .cal-num--weekend { color: var(--red); }
        .cal-num--holiday { color: var(--amber); }
        .cal-min-stay-badge {
            font-size: 0.65rem;
            padding: 1px 5px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--amber);
            border-radius: 3px;
            font-weight: 600;
        }

        .cal-holiday-label {
            font-size: 0.6rem;
            color: var(--amber);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Booked day */
        .cal-booked {
            padding: 3px 5px;
            background: rgba(108,140,255,0.2);
            border-left: 3px solid var(--accent);
            border-radius: 3px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-booked--checkin { border-left-color: var(--green); }

        /* Gap */
        .cal-gap {
            padding: 3px 5px;
            background: rgba(248,113,113,0.2);
            border-left: 3px solid var(--red);
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--red);
        }

        /* Prices for free days */
        .cal-prices {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: auto;
            font-family: var(--font-mono);
        }
        .cal-price-base {
            font-size: 0.78rem;
            color: var(--text-primary);
            font-weight: 600;
        }
        .cal-price-platform {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .cal-legend {
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-5);
            margin-top: var(--sp-6);
            padding: var(--sp-4);
            background: var(--bg-raised);
            border-radius: var(--radius);
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }
        .cal-legend-item { display: flex; align-items: center; gap: var(--sp-2); }
        .cal-legend-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
        .cal-legend-price {
            width: 40px;
            text-align: right;
            font-family: var(--font-mono);
        }
        .cal-legend-price--base {
            font-size: 0.78rem;
            color: var(--text-primary);
            font-weight: 600;
        }
        .cal-legend-price--platform {
            font-size: 0.68rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Календарь</h1>
        <p class="page-subtitle" th:if="${property != null}" th:text="${property.name}"></p>
    </div>

    <div class="cal-nav">
        <a th:href="@{/calendar(year=${prevYear},month=${prevMonth})}">◂</a>
        <div class="cal-month" th:text="${monthName}"></div>
        <a th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">▸</a>
    </div>

    <div th:if="${property == null}" class="card" style="text-align:center; padding: var(--sp-10);">
        <div class="muted">Добавьте объект в <a th:href="@{/settings/properties}">настройках</a></div>
    </div>

    <th:block th:if="${property != null}">
        <div class="cal-grid">
            <div class="cal-header">Пн</div><div class="cal-header">Вт</div><div class="cal-header">Ср</div>
            <div class="cal-header">Чт</div><div class="cal-header">Пт</div>
            <div class="cal-header" style="color:var(--red)">Сб</div>
            <div class="cal-header" style="color:var(--red)">Вс</div>

            <!-- Empty cells before first day -->
            <th:block th:if="${!#lists.isEmpty(days)}">
                <th:block th:with="offset=${days[0].dayOfWeek() - 1}">
                    <div th:each="i : ${#numbers.sequence(1, offset)}" class="cal-day cal-day--empty" th:if="${offset > 0}"></div>
                </th:block>
            </th:block>

            <!-- Days -->
            <div th:each="day : ${days}" class="cal-day"
                 th:classappend="${day.today() ? ' cal-day--today' : ''} + ${day.past() ? ' cal-day--past' : ''}">

                <!-- Top: day number + min-stay badge -->
                <div class="cal-day-top">
                    <span class="cal-num"
                          th:classappend="${day.holiday() ? ' cal-num--holiday' : (day.weekend() ? ' cal-num--weekend' : '')}"
                          th:text="${day.dayOfMonth()}"></span>
                    <span th:if="${day.status() == 'free' && !day.past() && day.minStay() > 1}"
                          class="cal-min-stay-badge"
                          th:text="${day.minStay()} + 'н'"></span>
                </div>

                <!-- Holiday label -->
                <div th:if="${day.holidayName() != null}" class="cal-holiday-label"
                     th:text="${day.holidayName()}"
                     th:title="${day.holidayName()}"></div>

                <!-- BOOKED -->
                <th:block th:if="${day.status() == 'booked'}">
                    <div class="cal-booked" th:classappend="${day.checkIn() ? ' cal-booked--checkin' : ''}"
                         th:title="${(day.guestName() ?: 'Гость') + ' | ' + (day.source() ?: '')}">
                        <span th:text="${day.guestName() ?: day.source() ?: 'Бронь'}"></span>
                    </div>
                </th:block>

                <!-- GAP -->
                <th:block th:if="${day.status() == 'gap'}">
                    <div class="cal-gap">⚠ дыра</div>
                </th:block>

                <!-- FREE (future only) -->
                <th:block th:if="${day.status() == 'free' && !day.past()}">
                    <div class="cal-prices">
                        <span class="cal-price-base" th:text="${day.basePrice()} + ' ₽'"></span>
                        <span class="cal-price-platform" th:text="${day.platformPrice()} + ' ₽'"></span>
                    </div>
                </th:block>
            </div>
        </div>

        <!-- Legend -->
        <div class="cal-legend">
            <div class="cal-legend-item">
                <div class="cal-legend-swatch" style="background:rgba(108,140,255,0.3); border-left:3px solid var(--accent);"></div>
                <span>Бронь</span>
            </div>
            <div class="cal-legend-item">
                <div class="cal-legend-swatch" style="background:rgba(108,140,255,0.3); border-left:3px solid var(--green);"></div>
                <span>Заезд</span>
            </div>
            <div class="cal-legend-item">
                <div class="cal-legend-swatch" style="background:rgba(248,113,113,0.2); border-left:3px solid var(--red);"></div>
                <span>Gap (дыра)</span>
            </div>
            <div class="cal-legend-item">
                <div class="cal-legend-swatch" style="background:var(--amber);"></div>
                <span>Праздник</span>
            </div>
            <div class="cal-legend-item">
                <span class="cal-legend-price cal-legend-price--base">3200 ₽</span>
                <span>— ваша цена</span>
            </div>
            <div class="cal-legend-item">
                <span class="cal-legend-price cal-legend-price--platform">3776 ₽</span>
                <span>— на площадках (с наценкой)</span>
            </div>
            <div class="cal-legend-item">
                <span class="cal-min-stay-badge">2н</span>
                <span>— минимальный срок</span>
            </div>
        </div>

    </th:block>

</div>
</body>
</html>
