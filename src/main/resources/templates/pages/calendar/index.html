<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Календарь</title>
    <style>
        .cal-nav { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-6); }
        .cal-nav a { color: var(--text-secondary); font-size: var(--text-lg); text-decoration: none; padding: var(--sp-2); }
        .cal-nav a:hover { color: var(--text-primary); }
        .cal-month { font-size: var(--text-xl); font-weight: var(--weight-semibold); min-width: 250px; text-align: center; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: var(--border-subtle);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .cal-header {
            background: var(--bg-raised);
            padding: var(--sp-2);
            text-align: center;
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .cal-day {
            background: var(--bg-surface);
            padding: var(--sp-2) var(--sp-3);
            min-height: 80px;
            position: relative;
            transition: background var(--duration) var(--ease);
        }
        .cal-day:hover { background: var(--bg-hover); }
        .cal-day--empty { background: var(--bg-root); }
        .cal-day--today { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
        .cal-day--past { opacity: 0.5; }
        .cal-day--weekend .cal-num { color: var(--red); }
        .cal-day--holiday .cal-num { color: var(--amber); }

        .cal-num {
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            margin-bottom: var(--sp-1);
        }
        .cal-price {
            font-size: var(--text-xs);
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .cal-booking {
            font-size: 0.7rem;
            padding: 2px 4px;
            border-radius: 3px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-booking--booked { background: var(--accent-glow); color: var(--accent); border-left: 2px solid var(--accent); }
        .cal-booking--gap { background: var(--red-dim); color: var(--red); border-left: 2px solid var(--red); }
        .cal-booking--checkin { border-left: 2px solid var(--green); }

        .cal-holiday-name {
            font-size: 0.6rem;
            color: var(--amber);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cal-legend {
            display: flex;
            gap: var(--sp-6);
            margin-top: var(--sp-4);
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }
        .cal-legend span { display: flex; align-items: center; gap: var(--sp-2); }
        .cal-legend-dot {
            width: 10px; height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Календарь</h1>
        <p class="page-subtitle" th:if="${property != null}" th:text="${property.name}"></p>
    </div>

    <!-- Navigation -->
    <div class="cal-nav">
        <a th:href="@{/calendar(year=${prevYear},month=${prevMonth})}">◂</a>
        <div class="cal-month" th:text="${monthName}"></div>
        <a th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">▸</a>
    </div>

    <div th:if="${property == null}" class="card" style="text-align:center; padding: var(--sp-10);">
        <div class="muted">Добавьте объект в <a th:href="@{/settings/properties}">настройках</a></div>
    </div>

    <th:block th:if="${property != null}">
        <!-- Calendar grid -->
        <div class="cal-grid">
            <!-- Headers -->
            <div class="cal-header">Пн</div>
            <div class="cal-header">Вт</div>
            <div class="cal-header">Ср</div>
            <div class="cal-header">Чт</div>
            <div class="cal-header">Пт</div>
            <div class="cal-header" style="color: var(--red);">Сб</div>
            <div class="cal-header" style="color: var(--red);">Вс</div>

            <!-- Empty cells before first day -->
            <th:block th:if="${!#lists.isEmpty(days)}">
                <th:block th:with="offset=${days[0].dayOfWeek() - 1}">
                    <div th:each="i : ${#numbers.sequence(1, offset)}" class="cal-day cal-day--empty" th:if="${offset > 0}"></div>
                </th:block>
            </th:block>

            <!-- Days -->
            <div th:each="day : ${days}"
                 class="cal-day"
                 th:classappend="${day.today() ? ' cal-day--today' : ''} + ${day.past() ? ' cal-day--past' : ''} + ${day.weekend() ? ' cal-day--weekend' : ''} + ${day.holiday() ? ' cal-day--holiday' : ''}">

                <div class="cal-num" th:text="${day.dayOfMonth()}"></div>

                <!-- Holiday name -->
                <div th:if="${day.holidayName() != null}" class="cal-holiday-name" th:text="${day.holidayName()}" th:title="${day.holidayName()}"></div>

                <!-- Booking bar -->
                <div th:if="${day.status() == 'booked'}" class="cal-booking cal-booking--booked"
                     th:classappend="${day.checkIn() ? ' cal-booking--checkin' : ''}"
                     th:text="${day.guestName() ?: day.source()}"
                     th:title="${(day.guestName() ?: '') + ' | ' + (day.source() ?: '')}">
                </div>

                <!-- Gap warning -->
                <div th:if="${day.status() == 'gap'}" class="cal-booking cal-booking--gap">⚠ gap</div>

                <!-- Price (only for future free days) -->
                <div th:if="${day.status() == 'free' && !day.past()}" class="cal-price" th:text="${day.basePrice()} + '₽'"></div>
            </div>
        </div>

        <!-- Legend -->
        <div class="cal-legend">
            <span><div class="cal-legend-dot" style="background: var(--accent);"></div> Бронь</span>
            <span><div class="cal-legend-dot" style="background: var(--red);"></div> Gap (дыра)</span>
            <span><div class="cal-legend-dot" style="background: var(--amber);"></div> Праздник</span>
            <span><div class="cal-legend-dot" style="background: var(--green);"></div> Заезд</span>
        </div>
    </th:block>

</div>
</body>
</html>
