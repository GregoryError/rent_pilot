<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — RentOptima">RentOptima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/core.css}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__logo">
                <span>R</span>entOptima
            </div>

            <nav class="sidebar__nav">
                <div class="nav-section">Аналитика</div>
                <a th:href="@{/dashboard}"
                   th:classappend="${activePage == 'dashboard'} ? 'nav-item--active'"
                   class="nav-item">
                    <span>◉</span> Dashboard
                </a>

                <div class="nav-section">Управление</div>
                <a th:href="@{/calendar}" class="nav-item">
                    <span>▦</span> Календарь
                </a>
                <a th:href="@{/pricing}" class="nav-item">
                    <span>◈</span> Ценообразование
                </a>
                <a th:href="@{/expenses}" class="nav-item">
                    <span>◇</span> Расходы
                </a>

                <div class="nav-section">Данные</div>
                <a th:href="@{/feedback}" class="nav-item">
                    <span>◎</span> Отзывы
                </a>
                <a th:href="@{/chat}" class="nav-item">
                    <span>◬</span> AI Чат
                </a>

                <div class="nav-section">Система</div>
                <a th:href="@{/settings}"
                   th:classappend="${activePage == 'settings'} ? 'nav-item--active'"
                   class="nav-item">
                    <span>⚙</span> Настройки
                </a>
            </nav>

            <div class="sidebar__footer">
                <div sec:authentication="principal.displayName">User</div>
                <a th:href="@{/logout}" class="muted text-sm">Выйти</a>
            </div>
        </aside>

        <!-- Page content -->
        <main class="main-content">
            <!-- Flash messages -->
            <div th:if="${success}" class="toast" id="toast">
                <span th:text="${success}"></span>
            </div>

            <div layout:fragment="content"></div>
        </main>
    </div>

    <script>
        // Auto-hide toast
        const toast = document.getElementById('toast');
        if (toast) setTimeout(() => toast.style.display = 'none', 3000);
    </script>
    <script layout:fragment="scripts"></script>
</body>
</html>
