<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>

<!--/* Полоса «Подтвердите почту» вверху кабинета (модель: verifyBanner, pageInactive). Одна строка:
     текст, «Отправить ещё раз», «Изменить адрес» (форма раскрывается под полосой) и ✕ — скрыть до
     завтра (дата в localStorage, только удобство). В последние сутки перед закрытием кабинета ✕ нет.
     После срока вместо полосы — экран /verify-email. */-->
<div th:fragment="banner" class="verify-strip" id="verify-banner" role="status"
     th:if="${verifyBanner != null and verifyBanner.inLayout}"
     th:classappend="${verifyBanner.urgent} ? 'verify-strip--urgent'">
    <div class="verify-strip__line">
        <span class="verify-strip__text"
              th:title="${(verifyBanner.neverSent ? 'Отправим письмо со ссылкой на ' : 'Письмо со ссылкой отправлено на ') + verifyBanner.email + '.'
                        + (verifyBanner.deadline != null ? ' Без подтверждения кабинет закроется ' + verifyBanner.deadline + '.' : '')
                        + (pageInactive ? ' Пока почта не подтверждена, страница бронирования не принимает гостей.' : '')}">
            <b>Подтвердите почту</b><span class="verify-strip__more">
                <span th:text="${verifyBanner.email}">host@example.com</span>, чтобы не потерять доступ</span><span
                class="verify-strip__when" th:if="${verifyBanner.deadline != null}"
                th:text="' — до ' + ${verifyBanner.deadline}"> — до 21 октября</span>
        </span>
        <span class="verify-strip__actions">
            <form class="verify-strip__form" th:action="@{/account/verify/resend}" method="post">
                <input type="hidden" name="back" th:value="${verifyBanner.back}">
                <button type="submit" class="verify-strip__link">
                    <span class="verify-strip__long" th:text="${verifyBanner.neverSent} ? 'Отправить письмо' : 'Отправить ещё раз'">Отправить ещё раз</span><span
                        class="verify-strip__short">Отправить</span>
                </button>
            </form>
            <button type="button" class="verify-strip__link" aria-controls="vb-change" aria-expanded="false"
                    id="vb-change-toggle"><span class="verify-strip__long">Изменить адрес</span><span
                    class="verify-strip__short">Изменить</span></button>
            <button type="button" class="verify-strip__close" id="vb-close" th:unless="${verifyBanner.urgent}"
                    aria-label="Скрыть до завтра" title="Скрыть до завтра">✕</button>
        </span>
    </div>
    <form id="vb-change" class="verify-strip__change" hidden th:action="@{/account/email}" method="post">
        <input type="hidden" name="back" th:value="${verifyBanner.back}">
        <div class="form-group">
            <label class="form-label" for="vb-email">Новый адрес</label>
            <input type="email" id="vb-email" name="email" class="form-input" required
                   inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
            <label class="form-label" for="vb-password">Пароль от OptiRent</label>
            <input type="password" id="vb-password" name="password" class="form-input" required
                   autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-ghost">Изменить адрес</button>
    </form>
    <script>
        (function () {
            var strip = document.getElementById('verify-banner'), key = 'optirent.verifyStrip.hiddenOn';
            var today = new Date().toISOString().slice(0, 10);
            var close = document.getElementById('vb-close');
            try { if (close && localStorage.getItem(key) === today) strip.hidden = true; } catch (e) {}
            if (close) close.addEventListener('click', function () {
                strip.hidden = true;
                try { localStorage.setItem(key, today); } catch (e) {}
            });
            var toggle = document.getElementById('vb-change-toggle'), form = document.getElementById('vb-change');
            toggle.addEventListener('click', function () {
                form.hidden = !form.hidden;
                toggle.setAttribute('aria-expanded', String(!form.hidden));
                if (!form.hidden) document.getElementById('vb-email').focus();
            });
        })();
    </script>
</div>

<!-- Пояснение у ссылок на страницу бронирования (модель: pageInactive). Письмо — из плашки выше -->
<div th:fragment="page-note" class="page-inactive-note" role="status" th:if="${pageInactive}">
    Ссылка и код для сайта заработают после подтверждения почты — пока гости по ссылке видят
    «Страница скоро заработает». Настраивать страницу можно уже сейчас.
</div>

</body>
</html>
