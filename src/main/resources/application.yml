spring:
  application:
    name: rentoptima

  datasource:
    url: jdbc:postgresql://localhost:5432/rentoptima
    username: rentoptima
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 24h

logging:
  level:
    ru.rentoptima: DEBUG
    org.springframework.security: INFO
