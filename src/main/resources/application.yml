spring:
  application:
    name: rentoptima

  datasource:
    url: jdbc:postgresql://localhost:5432/rentoptima
    username: rentoptima
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # SMTP для писем гостям о бронях с виджета. Пока SMTP_HOST и MAIL_FROM не заданы,
  # письма молча пропускаются (EmailService).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SMTP_SSL:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  # Сжатие ответов: бандл виджета и JSON его API. Если перед приложением сжимает nginx,
  # это ничего не ломает — уже сжатое он не трогает.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,text/calendar
  servlet:
    session:
      timeout: 24h

logging:
  level:
    ru.rentoptima: DEBUG
    org.springframework.security: INFO

app:
  # Удалённые ручные записи ещё 90 дней уходят в iCal-экспорт со STATUS:CANCELLED.
  # false — не отдавать (если площадка не читает STATUS и закрывает даты по ним).
  ical:
    export-cancelled: ${APP_ICAL_EXPORT_CANCELLED:true}

  # От кого уходят письма гостям о бронях. Пусто — письма не отправляются.
  mail:
    from: ${MAIL_FROM:}

encryption:
  key: ${ENCRYPTION_KEY:}
