spring:
  application:
    name: rentoptima

  datasource:
    url: jdbc:postgresql://localhost:5432/rentoptima
    username: rentoptima
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 24h

logging:
  level:
    ru.rentoptima: DEBUG
    org.springframework.security: INFO

app:
  # Удалённые ручные записи ещё 30 дней уходят в iCal-экспорт со STATUS:CANCELLED.
  # false — не отдавать (если площадка не читает STATUS и закрывает даты по ним).
  ical:
    export-cancelled: ${APP_ICAL_EXPORT_CANCELLED:true}

  # hCaptcha для заявок с виджета бронирования. Пусто — капча выключена.
  hcaptcha:
    site-key: ${HCAPTCHA_SITE_KEY:}
    secret: ${HCAPTCHA_SECRET:}

encryption:
  key: ${ENCRYPTION_KEY:}
