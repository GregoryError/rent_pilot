first:
  title: Первые шаги
  progress: "{0} из {1}"
  do: Сделать
  hide: Скрыть
  collapse: Свернуть
  expand: Показать
  badge: Первые шаги
  done.title: Всё готово!
  done.text: Вы прошли первые шаги. Дальше OptiRent работает сам — заглядывайте в шахматку.
  property: Добавить объект
  platform: Подключить первую площадку
  fetched: Площадка забрала вашу ссылку
  fetched.wait: Отметится само, когда площадка в первый раз заберёт ссылку.
  booking: Увидеть первую бронь в шахматке
  page: Создать страницу бронирования
  card: Распечатать карточку для гостей

# Пустые страницы: что здесь будет и что сделать дальше
empty:
  grid.title: Здесь будет шахматка
  grid.text: Шахматка — календарь всех ваших броней. Добавьте квартиру, и он появится.
  grid.button: Добавить квартиру
  platforms.title: Площадок пока нет
  platforms.text: Подключите площадки, где есть ваше объявление, — их брони соберутся в шахматке, а даты перестанут пересекаться.
  platforms.button: Подключить площадку
  bookings.title: Заявок пока нет
  bookings.text: Сюда приходят заявки с вашей страницы бронирования. Отправьте ссылку на неё гостям.
  bookings.button: К странице бронирования
  expenses.title: Расходов за этот месяц нет
  expenses.text: Записывайте уборку, расходники и ремонт — будет видно, сколько вы зарабатываете на самом деле.
  reviews.title: Отзывов пока нет
  reviews.text: Отправьте гостю ссылку на анкету после выезда — его оценки появятся здесь.
  reviews.button: Взять ссылку на анкету
  stats.title: Страницу ещё никто не открывал
  stats.text: Когда гости начнут открывать вашу страницу бронирования, здесь появится, сколько из них дошли до заявки.
  stats.button: Открыть страницу бронирования

back:
  cabinet: Вернуться в кабинет

# Сопровождение после мастера: плашка в кабинете и сообщение в Telegram
