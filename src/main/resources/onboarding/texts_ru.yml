  bookings: "С площадки «{0}» пришли первые брони — они уже в шахматке."
  # напоминание в чек-листе: прошли сутки, а площадка ни разу не забрала ссылку
  stale: "«{0}»: ссылку пока не забирали. Проверьте, что вставили её в кабинете площадки."
