# Тексты онбординга (ru). Один файл на язык: для английского — texts_en.yml с теми же ключами.
#
# Правила языка: на «вы», короткие фразы, без технических слов. Вместо них —
# «ссылка с площадки», «ссылка для площадки», «площадка», «синхронизация», «шахматка».
# Запрещённые слова проверяет OnboardingTextsTest.

common:
  skip: Пропустить, настрою сам
  back: Назад
  next: Дальше
  copy: Скопировать
  copied: Скопировано
  step: "Шаг {0} из {1}"

steps:
  start: С чего начнём
  property: Ваша квартира
  platforms: Площадки
  links: Ссылки
  page: Страница бронирования

start:
  title: С чего начнём?
  lead: Выберите, что вам нужнее сейчас. Остальное можно подключить позже.
  a.title: Сдаю на Авито, Циан, Суточно — хочу, чтобы даты не пересекались
  a.text: Соберём брони со всех площадок в одном календаре. Бронь на одной площадке закроет даты на остальных.
  b.title: Хочу принимать брони напрямую, без комиссии площадок
  b.text: Сделаем вашу страницу бронирования — ссылку можно отправлять гостям.
  both: И то и другое

property:
  title: Расскажите о квартире
  lead: Только самое нужное. Остальное добавите потом.
  name: Как назовём
  name.hint: "Как вам удобно: «Студия у парка», «Садовая, 5»"
  city: Город
  count: Сколько таких квартир
  count.hint: Обычно одна. Если сдаёте несколько одинаковых номеров — укажите, сколько.
  price: Цена за ночь, ₽
  price.hint: Примерная. Точные цены по дням настроите позже.
  existing: "У вас уже есть объект «{0}». Продолжим с ним."
  error.name: Напишите название квартиры
  error.city: Укажите город
  error.price: Цена — число больше нуля

platforms:
  title: Где вы сдаёте?
  lead: Отметьте все площадки, где есть ваше объявление. Можно выбрать несколько.
  other: Другая
  other.name: Как называется площадка
  error.none: Отметьте хотя бы одну площадку — или пропустите этот шаг

links:
  title: Соединим площадки с OptiRent
  lead: У каждой площадки два действия. Сначала берём её ссылку, потом отдаём ей нашу — так площадки узнают о бронях друг друга.
  one.title: Ссылка с площадки
  one.text: "По ней мы узнаём, какие даты заняты на площадке «{0}»."
  one.label: Вставьте ссылку сюда
  one.check: Проверить ссылку
  one.where: Где её взять
  one.saved: Ссылка сохранена
  two.title: Ссылка для площадки
  two.text: "Её нужно вставить в кабинете площадки «{0}» — тогда там закроются даты, занятые на других площадках и вручную."
  two.where: Куда её вставить
  refresh: "{0} забирает ссылку не сразу: {1}."
  generic.from: "В кабинете площадки откройте своё объявление и найдите настройки календаря или синхронизации. Там будет ссылка на календарь — длинный адрес, который начинается с https://. Скопируйте его целиком."
  generic.to: "Там же, в настройках календаря или синхронизации, есть поле для ссылки на чужой календарь. Вставьте туда нашу ссылку и сохраните."
  generic.help: "Не нашли? Напишите нам — подскажем: "
  notes: Что стоит знать
  guide: Открыть инструкцию
  later: Подключу позже
  done: Готово, дальше
  status.connected: Подключено
  status.waiting: Ждёт ссылку с площадки

link:
  found: "Нашли {0} {1}. Ссылка сохранена."
  empty: Ссылка работает, занятых дат на площадке пока нет. Сохранили.
  notCalendar: По этой ссылке нет календаря. Похоже, скопирован адрес страницы, а не ссылка на календарь — посмотрите «Где её взять».
  unreachable: Ссылка не открывается — проверьте, что скопировали её целиком.
  invalid: Это не похоже на ссылку. Она должна начинаться с https://.
  empty.field: Вставьте ссылку из кабинета площадки.
  own: Это наша ссылка — она для площадки, её нужно вставить в кабинете площадки. А сюда нужна ссылка из кабинета площадки, см. «Где её взять».
  mismatch: "Похоже, это ссылка с площадки «{0}», а карточка — «{1}»."
  mismatch.move: "Перенести в карточку «{0}»"
  mismatch.keep: Оставить здесь
  moved: "Перенесли ссылку в карточку «{0}»."

page:
  title: Ваша страница бронирования
  lead: Гость откроет её по ссылке, выберет даты и оставит заявку. Комиссии нет.
  name: Название на странице
  photos: Фотографии
  photos.hint: От одной до трёх, чтобы начать. JPEG или PNG. Остальные добавите позже.
  price: Цена за ночь, ₽
  phone: Телефон для гостей
  telegram: Telegram
  contacts.hint: Гость увидит контакты после брони. Можно оставить пустыми.
  create: Создать страницу
  ready.title: Ваша страница готова
  ready.open: Открыть
  ready.copy: Скопировать ссылку
  ready.design: Настроить вид
  ready.photos.failed: "Не все фото подошли: {0}"
  more.title: Сдаёте ещё и на площадках?
  more.text: Подключите их, чтобы бронь с вашей страницы сразу закрывала даты там.
  more.button: Подключить площадки
  error.name: Напишите название

done:
  title: Готово
  links: Площадки забирают ссылку раз в 10–60 минут. Как только первая заберёт — пришлём уведомление.
  links.waiting: "Осталось подключить: {0}. Вернуться к ним можно в любой момент — из списка первых шагов."
  page: Ссылку на страницу бронирования можно отправлять гостям уже сейчас.
  nothing: Вы пока ничего не подключили. Это можно сделать позже — из списка первых шагов.
  next: Дальше покажем шахматку — календарь всех ваших броней.
  button: Открыть шахматку
