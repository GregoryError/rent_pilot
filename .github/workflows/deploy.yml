name: Deploy to optirent.ru

# main выкатывается в /opt/rentoptima-staging (бывший staging, теперь prod на optirent.ru).
# Скрипт сам пропускает выкладку, пока в .env установки не стоит DEPLOY_BRANCH=main, —
# до переезда push в main ничего не меняет. Прежний prod (/opt/rentoptima, ветка
# legacy-rc, pilot.optirent.ru) выкатывается вручную. См. patches/INTEGRATION_PROD_SWITCH.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy main to optirent.ru
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
              'bash /opt/rentoptima-staging/scripts/deploy.sh main'

      - name: Notify success
        if: success()
        run: echo "✅ main deployed (skipped on the server if the install does not track main yet)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed. Check /var/log/optirent-staging-deploy.log."
