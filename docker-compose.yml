services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/rentoptima
      - SPRING_DATASOURCE_USERNAME=rentoptima
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - RC_USERNAME=${RC_USERNAME:-}
      - RC_PASSWORD=${RC_PASSWORD:-}
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - TZ=Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=rentoptima
      - POSTGRES_USER=rentoptima
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Moscow
      - PGTZ=Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentoptima"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: