services:
  app:
    build: .
    container_name: rentoptima-staging-app
    ports:
      - "127.0.0.1:${STAGING_APP_PORT:-8081}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/rentoptima_staging
      - SPRING_DATASOURCE_USERNAME=rentoptima
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Moscow
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - APP_ENVIRONMENT=staging
      - APP_ICAL_EXPORT_CANCELLED=${APP_ICAL_EXPORT_CANCELLED:-true}
      - JAVA_TOOL_OPTIONS=-Xmx512m -XX:MaxRAMPercentage=60
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: rentoptima-staging-db
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=rentoptima_staging
      - POSTGRES_USER=rentoptima
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Moscow
      - PGTZ=Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentoptima"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  staging-pgdata:
    external: true
    name: rentoptima-staging_pgdata-staging
